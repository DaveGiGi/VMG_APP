<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b2239">
  <title>VMG Sailing</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="map"></div>

  <!-- Search at the top -->
  <form id="search" class="search" autocomplete="off">
    <input id="search-input" type="search" placeholder="Search target (place, harbour …)" aria-label="Search target">
    <button type="submit" aria-label="Search">🔍</button>
    <ul id="search-results" class="search-results" hidden></ul>
  </form>

  <!-- Buttons on the right -->
  <div class="fab-col">
    <button id="btn-pick" class="fab" title="Tap map to set target">🎯</button>
    <button id="btn-center" class="fab" title="Center on boat">⌖</button>
    <button id="btn-demo" class="fab" title="Demo mode">▶︎</button>
    <button id="btn-clear" class="fab" title="Clear target">✕</button>
  </div>

  <div id="hint" class="hint" hidden>Tap the map to set the target</div>

  <!-- Display at the bottom -->
  <section class="panel">
    <div class="vmg">
      <div class="vmg-main">
        <div class="label">VMG to target</div>
        <div class="big"><span id="v-vmg">–</span><small> kn</small></div>
      </div>
      <div class="vmg-side">
        <div class="label">Deviation</div>
        <div id="v-dev" class="dev"></div>
        <div id="v-status" class="status">Waiting for GPS …</div>
      </div>
    </div>
    <div class="grid">
      <div><span class="label">SOG</span><span id="v-sog">–</span><small>kn</small></div>
      <div><span class="label">COG</span><span id="v-cog">–</span><small>°</small></div>
      <div><span class="label">Bearing</span><span id="v-brg">–</span><small>°</small></div>
      <div><span class="label">Distance</span><span id="v-dtw">–</span><small>nm</small></div>
      <div><span class="label">ETA</span><span id="v-eta">–</span><small id="v-eta-rest"></small></div>
      <div><span class="label">Accuracy</span><span id="v-acc">–</span><small>m</small></div>
    </div>

    <!-- Only visible in demo mode -->
    <div id="demo-controls" class="demo" hidden>
      <label>Course <output id="o-course">45</output>°
        <input id="i-course" type="range" min="0" max="359" value="45">
      </label>
      <label>Speed <output id="o-speed">6.0</output> kn
        <input id="i-speed" type="range" min="0" max="15" step="0.5" value="6">
      </label>
    </div>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
